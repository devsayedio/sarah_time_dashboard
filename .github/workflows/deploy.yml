name: Deploy Dashboard to Cloudflare Workers

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  DASHBOARD_URL: "https://sarah-time-dashboard.royalcourtbd.com/"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Generate build metadata
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_ENV: production
        run: npm run build:info

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify Basic Authentication boundary
        run: |
          set -euo pipefail
          status="000"
          for attempt in $(seq 1 12); do
            status=$(curl --silent --output /dev/null \
              --connect-timeout 10 --max-time 20 \
              --write-out '%{http_code}' "$DASHBOARD_URL" || true)
            if [ "$status" = "401" ]; then
              exit 0
            fi
            echo "Attempt $attempt/12 returned HTTP $status; retrying in 5 seconds..."
            sleep 5
          done
          echo "::error::Expected unauthenticated HTTP 401, received $status"
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "### ${{ job.status == 'success' && '✅ Cloudflare deploy succeeded' || '❌ Cloudflare deploy failed' }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | $DASHBOARD_URL |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Triggered by | ${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
